services:
  postgres:
    image: postgres:16-alpine
    container_name: matchforge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchforge}
      POSTGRES_USER: ${POSTGRES_USER:-matchforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}
    ports:
      - "5433:5432"
    volumes:
      - matchforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchforge} -d ${POSTGRES_DB:-matchforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchforge-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-matchforge}
      DB_USERNAME: ${POSTGRES_USER:-matchforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}
      MATCHFORGE_JWT_SECRET: ${MATCHFORGE_JWT_SECRET:?MATCHFORGE_JWT_SECRET must be set (see .env.example)}
      MATCHFORGE_ADMIN_USERNAME: ${MATCHFORGE_ADMIN_USERNAME:?MATCHFORGE_ADMIN_USERNAME must be set}
      MATCHFORGE_ADMIN_PASSWORD: ${MATCHFORGE_ADMIN_PASSWORD:?MATCHFORGE_ADMIN_PASSWORD must be set}
      MATCHFORGE_FLYWAY_BASELINE: ${MATCHFORGE_FLYWAY_BASELINE:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  matchforge-postgres-data: