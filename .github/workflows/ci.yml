name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://localhost:5432/matchforge_test
      DB_USERNAME: matchforge
      DB_PASSWORD: matchforge
      MATCHFORGE_JWT_SECRET: ci-jwt-secret-key-at-least-32-chars-long
      MATCHFORGE_FLYWAY_BASELINE: "true"
      # Must match application-test.yml defaults and AuthTestHelper.loginAdmin()
      MATCHFORGE_ADMIN_USERNAME: testadmin
      MATCHFORGE_ADMIN_PASSWORD: TestAdminPassphrase-1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matchforge_test
          POSTGRES_USER: matchforge
          POSTGRES_PASSWORD: matchforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchforge -d matchforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Unit, JDBC integration, and Testcontainers tests
        run: ./mvnw -B clean verify

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Docker image build
        run: docker build -t matchforge:ci .