spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

matchforge:
  api:
    swagger-ui-enabled: false
    open-api-enabled: false
  security:
    jwt-secret: ${MATCHFORGE_JWT_SECRET:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false