spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: matchforge-prod

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: ${MATCHFORGE_FLYWAY_BASELINE:false}

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

matchforge:
  api:
    swagger-ui-enabled: false
    open-api-enabled: false
  security:
    jwt-secret: ${MATCHFORGE_JWT_SECRET:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false