spring:
  application:
    name: matchforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/matchforge}
    username: ${DB_USERNAME:matchforge}
    password: ${DB_PASSWORD:matchforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.matchforge: INFO
    org.hibernate.SQL: WARN

server:
  error:
    whitelabel:
      enabled: false