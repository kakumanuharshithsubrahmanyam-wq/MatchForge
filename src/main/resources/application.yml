spring:
  application:
    name: matchforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/matchforge}
    username: ${DB_USERNAME:matchforge}
    password: ${DB_PASSWORD:matchforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: ${MATCHFORGE_FLYWAY_BASELINE:false}
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    root: INFO
    com.matchforge: INFO
    org.hibernate.SQL: WARN

server:
  error:
    whitelabel:
      enabled: false

matchforge:
  api:
    swagger-ui-enabled: true
    open-api-enabled: true
  security:
    max-failed-login-attempts: 5
    login-lockout-seconds: 900
    jwt-issuer: matchforge
    jwt-expiration-seconds: 3600
    jwt-secret: ${MATCHFORGE_JWT_SECRET:local-dev-only-secret-key-32chars-min!!}
    admin-username: ${MATCHFORGE_ADMIN_USERNAME:}
    admin-password: ${MATCHFORGE_ADMIN_PASSWORD:}
  matchmaking:
    initial-rating-difference: 100
    rating-expansion: 50
    expansion-interval-seconds: 30
    max-rating-difference: 500
    queue-processing-interval-ms: 5000
  session:
    heartbeat-timeout-seconds: 60
    maintenance-interval-ms: 5000
    waiting-expiry-seconds: 3600